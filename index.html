  /* ---------- end cursor ---------- */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Nunito','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#4a3b32;
    min-height:100dvh;display:grid;place-items:center;
    background-color:#fdfbf7;
    background-image:radial-gradient(#efe3dc 2px,transparent 2.5px);
    background-size:34px 34px;
    overflow:hidden;
  }

  /* ---------- iPod body ---------- */
  .stage{position:relative;padding-bottom:3%}
  .ipod{
    --w:min(92vw, 360px, calc((100dvh - 48px) / 1.675));
    width:var(--w);height:calc(var(--w) * 1.675);
    font-size:calc(var(--w) * .039);
    position:relative;border-radius:calc(var(--w) * .085);
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 1px,rgba(0,0,0,.018) 1px 2px),
      linear-gradient(150deg,#fbfbfc 0%,#e3e3e6 28%,#f1f1f3 52%,#d3d3d7 78%,#e6e6e9 100%);
    box-shadow:
      inset 0 0 0 1.5px rgba(255,255,255,.95),
      inset 0 0 0 2.5px rgba(120,120,130,.28),
      inset 0 calc(var(--w)*.012) calc(var(--w)*.03) rgba(255,255,255,.9),
      inset 0 calc(var(--w)*-.02) calc(var(--w)*.04) rgba(0,0,0,.10),
      0 1px 0 #b9b9be, 0 2px 0 #aeaeb4, 0 3px 0 #a3a3aa,
      0 calc(var(--w)*.05) calc(var(--w)*.07) rgba(70,50,40,.25),
      0 calc(var(--w)*.12) calc(var(--w)*.18) rgba(120,90,70,.18);
  }
  .ipod::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.28) 100%);
  }

  /* ---------- screen ---------- */
  .bezel{
    position:absolute;left:50%;top:5.4%;transform:translateX(-50%);
    width:80%;padding:2.6%;
    background:linear-gradient(160deg,#1b1b1d,#050506);
    border-radius:calc(var(--w) * .028);
    box-shadow:0 0 0 1px #6f6f75,0 0 0 2px rgba(255,255,255,.65),0 1px 2px 2px rgba(0,0,0,.25),inset 0 1px 1px rgba(255,255,255,.18);
  }
  .lcd{
    position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;
    background:#fbfbfb;border-radius:calc(var(--w) * .008);
    display:flex;flex-direction:column;
    font-family:'Galmuri11','Galmuri9','DungGeunMo','VT323',monospace;
    font-size:.8em;
    font-smooth:never;-webkit-font-smoothing:none;
    text-rendering:optimizeSpeed;
    box-shadow:inset 0 0 6px rgba(0,0,0,.35);
  }
  .lcd::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
    background:
      linear-gradient(118deg,rgba(255,255,255,.22) 0 36%,rgba(255,255,255,0) 36.2%),
      linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 30%);
  }
  .lcd-head{
    flex:0 0 12%;display:flex;align-items:center;justify-content:space-between;
    padding:0 .7em;font-weight:800;font-size:.95em;color:#1d1d1f;
    background:linear-gradient(#f2f2f3 0%,#d3d3d6 50%,#b9b9be 51%,#c9c9cd 100%);
    border-bottom:1px solid #8b8b90;
  }
  .lcd-head .icons{display:flex;gap:.5em;align-items:center}
  .batt{width:1.4em;height:.7em;border:1px solid #333;border-radius:2px;position:relative;padding:1px;display:block}
  .batt::before{content:"";display:block;height:100%;width:80%;background:linear-gradient(#7fd46a,#3b9e2a)}
  .batt::after{content:"";position:absolute;right:-3px;top:25%;width:2px;height:50%;background:#333}

  .view{flex:1;min-height:0;display:flex;flex-direction:column}
  .view.text{display:none}
  .lcd.show-text .view.np{display:none}
  .lcd.show-text .view.text{display:flex}

  /* now playing */
  .lcd-body{flex:1;display:flex;align-items:center;gap:6%;padding:0 6%}
  .cover{
    width:36%;aspect-ratio:1;flex:none;border:1px solid #bdbdc2;
    background:linear-gradient(135deg,#f4eee8,#e3d8cd);background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;font-size:2em;
    box-shadow:0 2px 4px rgba(0,0,0,.25);
  }
  .meta{min-width:0}
  .meta .t{font-weight:700;font-size:1.3em;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .a{margin-top:.35em;color:#555;font-size:1.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .p{margin-top:.3em;color:#7a7a80;font-style:normal;font-size:1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lcd-foot{flex:0 0 22%;background:linear-gradient(#f6f6f7,#e9e9eb);border-top:1px solid #d8d8dc;padding:.5em .7em 0}
  .times{display:flex;justify-content:space-between;font-size:1em;line-height:1;color:#222}
  .prog{height:.55em;margin-top:.45em;background:linear-gradient(#bdbdc2,#dcdce0);border-radius:1px;position:relative;cursor:pointer;box-shadow:inset 0 1px 1px rgba(0,0,0,.25)}
  .prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#5aa0e8,#2a6cc4)}

  /* text pages (about / ng ...) */
  .textwrap{flex:1;min-height:0;position:relative}
  .textbox{position:absolute;inset:0;overflow-y:auto;padding:.7em .9em .9em;scrollbar-width:none;line-height:1.55;font-size:1em;color:#222}
  .textbox::-webkit-scrollbar{display:none}
  .textbox h4{font-size:1em;font-weight:800;color:#2a6cc4;margin:.7em 0 .15em}
  .textbox h4:first-child{margin-top:0}
  .textbox p{margin:0 0 .35em;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap}
  .textbox mark{color:inherit;padding:0 .08em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .hl-y{background:linear-gradient(transparent 38%,#fff36b 38%,#fff36b 92%,transparent 92%)}
  .hl-p{background:linear-gradient(transparent 38%,#ffb8d0 38%,#ffb8d0 92%,transparent 92%)}
  .hl-g{background:linear-gradient(transparent 38%,#b6f0c0 38%,#b6f0c0 92%,transparent 92%)}
  .hl-b{background:linear-gradient(transparent 38%,#b5dcff 38%,#b5dcff 92%,transparent 92%)}
  .sbar{position:absolute;right:2px;top:3px;bottom:3px;width:4px;border-radius:2px;background:rgba(0,0,0,.08)}
  .sbar i{position:absolute;left:0;right:0;top:0;height:30%;border-radius:2px;background:#7d7d84}

  .toast{
    position:absolute;left:50%;bottom:24%;transform:translateX(-50%);z-index:2;
    background:rgba(20,20,22,.82);color:#fff;font-size:.9em;padding:.35em .9em;border-radius:1em;
    opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none;
  }
  .toast.show{opacity:1}

  /* ---------- click wheel ---------- */
  .wheel{
    position:absolute;left:50%;top:71.5%;transform:translate(-50%,-50%);
    width:66%;aspect-ratio:1;border-radius:50%;touch-action:none;user-select:none;
    background:radial-gradient(circle at 50% 22%,#fafafa 0%,#e8e8ea 38%,#d3d3d7 100%);
    box-shadow:0 0 0 1px rgba(110,110,120,.35),0 1px 1px 1px rgba(255,255,255,.9),inset 0 2px 3px rgba(255,255,255,.95),inset 0 -3px 8px rgba(0,0,0,.14),0 3px 6px rgba(0,0,0,.18);
  }
  .w{
    position:absolute;display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:#8d8d93;font-weight:800;letter-spacing:.04em;
    text-shadow:0 1px 0 rgba(255,255,255,.95);
    -webkit-tap-highlight-color:transparent;padding:.8em;
  }
  .w svg{width:1.9em;height:1.9em;fill:currentColor;filter:drop-shadow(0 1px 0 rgba(255,255,255,.95))}
  .w:active,.w.on{color:#4f4f56}
  .w.menu{top:3.5%;left:50%;transform:translateX(-50%);font-size:1.35em}
  /* MUSIC 누르면 나오는 배너 창 */
  .bnr{display:block;width:100%;aspect-ratio:3.1/1;margin:0 0 .55em;border:1px solid #bdbdc2;border-radius:3px;overflow:hidden;background:#e3d8cd;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  a.bnr{cursor:pointer}
  .bnr img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
  .w.prev{left:3%;top:50%;transform:translateY(-50%)}
  .w.next{right:3%;top:50%;transform:translateY(-50%)}
  .w.pp{bottom:3.5%;left:50%;transform:translateX(-50%)}
  .center{
    position:absolute;left:50%;top:50%;width:37%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 50% 28%,#ffffff 0%,#f4f4f6 55%,#e4e4e8 100%);
    box-shadow:0 0 0 1px rgba(120,120,130,.4),0 1px 2px rgba(0,0,0,.2),inset 0 2px 2px #fff,inset 0 -2px 5px rgba(0,0,0,.08);
  }
  .center:active{background:radial-gradient(circle at 50% 28%,#f0f0f2,#dcdce0);box-shadow:0 0 0 1px rgba(120,120,130,.4),inset 0 2px 5px rgba(0,0,0,.2)}

  button.adm{background:none;border:none;padding:.15em .3em;margin:-.15em -.3em;cursor:pointer;color:inherit;font:inherit;display:flex;align-items:center}

  /* ---------- admin window ---------- */
  .adm-back{position:fixed;inset:0;background:rgba(40,40,50,.45);display:none;align-items:center;justify-content:center;padding:12px;z-index:50}
  .adm-back.show{display:flex}
  .adm-win{
    width:min(96vw,540px);max-height:90dvh;display:flex;flex-direction:column;overflow:hidden;
    background:#f6f6f8;border:1px solid #7d7d84;border-radius:8px;
    box-shadow:0 0 0 2px #fff,0 20px 50px rgba(0,0,0,.35);
    font-family:'Galmuri11','Galmuri9','DungGeunMo',monospace;font-size:13px;color:#222;
  }
  .adm-title{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-weight:700;
    background:linear-gradient(#f2f2f3 0%,#d3d3d6 50%,#b9b9be 51%,#c9c9cd 100%);border-bottom:1px solid #8b8b90}
  .adm-x{border:none;background:none;cursor:pointer;font:inherit;font-size:16px;color:#333}
  .adm-tabs{display:flex;gap:4px;padding:8px 10px 0;background:#e9e9ec;border-bottom:1px solid #b9b9be}
  .adm-tab{font:inherit;padding:6px 14px;border:1px solid #b9b9be;border-bottom:none;border-radius:6px 6px 0 0;background:#dcdce0;cursor:pointer;color:#555}
  .adm-tab.on{background:#f6f6f8;color:#111;font-weight:700;position:relative;top:1px}
  .adm-vol{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#f0f0f3;border-bottom:1px solid #c8c8cd}
  .adm-vol-ic{font-size:13px;line-height:1;width:1.3em;text-align:center}
  .adm-vol-num{width:2.4em;text-align:right;font-size:12px;color:#555}
  .adm-vol input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;min-width:0;height:14px;background:transparent;cursor:pointer;margin:0;
    --v:50%;
  }
  .adm-vol input[type=range]::-webkit-slider-runnable-track{
    height:3px;border-radius:2px;
    background:linear-gradient(90deg,#2a6cc4 var(--v),#c4c4ca var(--v));
  }
  .adm-vol input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:#c4c4ca}
  .adm-vol input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:#2a6cc4}
  .adm-vol input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:10px;height:10px;border-radius:50%;margin-top:-3.5px;
    background:#fff;border:1px solid #2a6cc4;box-shadow:0 1px 2px rgba(0,0,0,.25);
  }
  .adm-vol input[type=range]::-moz-range-thumb{
    width:8px;height:8px;border-radius:50%;background:#fff;border:1px solid #2a6cc4;box-shadow:0 1px 2px rgba(0,0,0,.25);
  }
  .adm-body{padding:12px;overflow:auto;flex:1;min-height:0}
  .adm-foot{padding:8px 12px;border-top:1px solid #c8c8cd;background:#ececef;display:flex;gap:8px;align-items:center;justify-content:space-between}
  .adm-status{font-size:12px;color:#555;flex:1;min-width:0;line-height:1.4}
  .adm-status.ok{color:#2a8a3a}
  .adm-status.err{color:#c43a3a}
  .adm-btn{font:inherit;padding:6px 12px;border:1px solid #7d7d84;border-radius:4px;background:linear-gradient(#fff,#dcdce0);cursor:pointer;color:#222;white-space:nowrap}
  .adm-btn.pri{background:linear-gradient(#6aaef0,#2a6cc4);color:#fff;border-color:#1f55a0}
  .adm-btn.del{color:#c43a3a}
  .adm-btn:active{filter:brightness(.92)}
  .adm-lab{display:block;margin:8px 0 3px;color:#555;font-size:12px}
  .adm-in,.adm-ta{width:100%;font:inherit;padding:6px 8px;border:1px solid #a9a9b0;border-radius:3px;background:#fff;color:#111}
  .adm-ta{min-height:150px;resize:vertical;line-height:1.5}
  .adm-card{border:1px solid #c8c8cd;border-radius:6px;background:#fff;padding:10px;margin-bottom:10px}
  .adm-row{display:flex;gap:6px}
  .adm-row .adm-in{flex:1;min-width:0}
  .adm-sec{font-weight:700;margin:2px 0 6px}
  .adm-hint{font-size:11.5px;color:#7a7a82;line-height:1.6;margin-top:8px}

  .stage::after{
    content:"";position:absolute;left:8%;right:8%;bottom:0;height:3.5%;
    background:radial-gradient(ellipse at center,rgba(90,60,40,.28),transparent 70%);
    filter:blur(6px);z-index:-1;
  }
</style>

<div id="ytbox" style="position:fixed;left:-9999px;top:0;width:200px;height:200px;overflow:hidden"><div id="ytplayer"></div></div>
<audio id="audio" preload="metadata"></audio>

<script>
/* =====================================================
   ✏️ 여기만 고치면 돼요
   ===================================================== */

// 재생할 노래 (src에 유튜브 링크를 넣어주세요)
let TRACKS = [
  { title:'Shadow', artist:'Middlepot', plist:'Extra Musics', src:'', cover:'' }
];

// MUSIC 버튼을 누르면 화면에 나오는 배너 (여러 개 가능, 비율 약 3:1 / 이미지를 누르면 link로 이동)
// 예: { img:'images/banner1.png', link:'https://example.com' }
let BANNERS = [];

// 휠 버튼을 눌렀을 때 화면에 나오는 글
// 줄 맨 앞에 "## " 를 붙이면 소제목이 돼요.
let PAGES = {
  prev: { title:'About', lines:[          // ⏮ 왼쪽 버튼
    '## 기본',
    '여기에 About 내용을 적어주세요.',
    '## 성향',
    '성향글을 ==한 줄씩== 적어주세요. ==p:분홍 형광펜==도 돼요.'
  ]},
  next: { title:'NG', lines:[             // ⏭ 오른쪽 버튼
    '## NG',
    '여기에 NG 내용을 적어주세요.'
  ]},
  pp:   { title:'Like', lines:[           // ⏯ 아래 버튼
    '## Like',
    '여기에 내용을 적어주세요.'
  ]}
};
/* ===================================================== */

(function(){
  const $ = id => document.getElementById(id);
  const audio = $('audio'), lcd = $('lcd'), box = $('textbox');
  audio.volume = .8;
  let idx = 0, page = null;

  const fmt = s => { s=Math.max(0,Math.floor(s||0)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0') };
  let toastT;
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1500) }

  /* ----- music ----- */
  function renderTrack(){
    const t = TRACKS[idx]; if(!t) return;
    $('title').textContent = t.title;
    $('artist').textContent = t.artist || '';
    $('plist').textContent = '☁️ ' + (t.plist || '');
    const c = $('cover');
    c.style.backgroundImage = t.cover ? `url("${t.cover}")` : '';
    c.textContent = t.cover ? '' : '🎵';
  }
  /* ----- 재생 엔진: 유튜브 링크 (mp3 직접 링크도 가능) ----- */
  const VOLKEY = 'ipod_volume_v1';
  let vol = .5;
  try{ const sv = parseFloat(localStorage.getItem(VOLKEY)); if(isFinite(sv)) vol = Math.min(1, Math.max(0, sv)) }catch(e){}
  audio.volume = vol;
  let mode = 'audio', yt = null, ytReady = false, ytWant = null, ytState = -1;
  function ytIdOf(u){
    if(!u) return null;
    u = String(u).trim();
    const m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/);
    if(m) return m[1];
    return /^[A-Za-z0-9_-]{11}$/.test(u) ? u : null;
  }
  function ensureYT(){
    if(yt || window.__ytLoading) return;
    window.__ytLoading = true;
    window.onYouTubeIframeAPIReady = ()=>{
      yt = new YT.Player('ytplayer', {
        width:'200', height:'200',
        playerVars:{playsinline:1, controls:0, disablekb:1, rel:0},
        events:{
          onReady: ()=>{
            ytReady = true; yt.setVolume(Math.round(vol*100));
            if(ytWant){ ytWant.autoplay ? yt.loadVideoById(ytWant.id) : yt.cueVideoById(ytWant.id) }
          },
          onStateChange: e=>{
            ytState = e.data;
            $('stateIcon').textContent = e.data === 1 ? '▶' : '❚❚';
            if(e.data === 0) loadTrack(idx+1, true);
            updateTime();
          },
          onError: ()=>toast('재생할 수 없는 영상이에요')
        }
      });
    };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }
  function ytLoad(id, autoplay){
    ensureYT(); ytWant = {id, autoplay};
    if(ytReady){ autoplay ? yt.loadVideoById(id) : yt.cueVideoById(id) }
  }
  const isPlaying = ()=> mode === 'yt' ? ytState === 1 : !audio.paused;
  function loadTrack(i, autoplay){
    idx = (i + TRACKS.length) % TRACKS.length;
    const t = TRACKS[idx];
    const id = ytIdOf(t.src);
    audio.pause();
    if(id){
      mode = 'yt';
      audio.removeAttribute('src'); audio.load();
      ytState = -1; $('stateIcon').textContent = '❚❚';
      ytLoad(id, !!autoplay);
      renderTrack(); updateTime();
    }else{
      mode = 'audio';
      if(ytReady){ try{ yt.pauseVideo() }catch(e){} }
      if(t.src){ audio.src = t.src; audio.load() } else { audio.removeAttribute('src'); audio.load() }
      renderTrack(); updateTime();
      if(autoplay) playMusic();
    }
  }
  function playMusic(){
    const t = TRACKS[idx];
    if(!t || !t.src){ toast('관리자에서 유튜브 링크를 넣어주세요'); return }
    if(mode === 'yt'){
      if(!ytReady){ ensureYT(); toast('불러오는 중이에요… 잠시 후 다시 눌러주세요'); return }
      yt.playVideo(); return;
    }
    audio.play().catch(()=>toast('재생할 수 없어요'));
  }
  function pauseMusic(){ if(mode === 'yt'){ if(ytReady) yt.pauseVideo() } else audio.pause() }
  const curTime = ()=> mode === 'yt' ? (ytReady && yt.getCurrentTime ? yt.getCurrentTime() : 0) : (audio.currentTime || 0);
  const durTime = ()=> mode === 'yt' ? (ytReady && yt.getDuration ? yt.getDuration() : 0) : audio.duration;
  function seekTo(r){
    const d = durTime();
    if(!isFinite(d) || !d) return;
    if(mode === 'yt') yt.seekTo(r*d, true); else audio.currentTime = r*d;
    updateTime();
  }
  function setVol(v){
    vol = Math.min(1, Math.max(0, v));
    audio.volume = vol;
    if(ytReady) yt.setVolume(Math.round(vol*100));
    try{ localStorage.setItem(VOLKEY, String(vol)) }catch(e){}
    syncVolUI();
  }
  function syncVolUI(){
    const s = $('admVol'); if(!s) return;
    const p = Math.round(vol*100);
    s.value = p; s.style.setProperty('--v', p + '%');
    $('admVolNum').textContent = p;
    $('admVolIc').textContent = p === 0 ? '🔇' : p < 50 ? '🔉' : '🔊';
  }
  $('admVol').addEventListener('input', e=>setVol(e.target.value/100));
  syncVolUI();
  setInterval(()=>{ if(mode === 'yt' && ytReady && ytState === 1) updateTime() }, 250);

  function updateTime(){
    const d = durTime(), c = curTime();
    $('cur').textContent = fmt(c);
    $('rem').textContent = '-' + fmt(isFinite(d) ? d-c : 0);
    $('bar').style.width = (isFinite(d)&&d>0 ? c/d*100 : 0) + '%';
  }
  audio.addEventListener('timeupdate', updateTime);
  audio.addEventListener('loadedmetadata', updateTime);
  audio.addEventListener('play',  ()=>$('stateIcon').textContent='▶');
  audio.addEventListener('pause', ()=>$('stateIcon').textContent='❚❚');
  audio.addEventListener('ended', ()=>loadTrack(idx+1,true));
  audio.addEventListener('error', ()=>{ if(audio.getAttribute('src')) toast('음원을 불러올 수 없어요') });
  $('prog').addEventListener('click', e=>{
    const r = e.currentTarget.getBoundingClientRect();
    seekTo((e.clientX-r.left)/r.width);
  });

  /* ----- screens ----- */
  // ==글자== 노랑 / ==p:글자== 분홍 / ==g:글자== 초록 / ==b:글자== 하늘 형광펜
  function inline(el, text){
    if(!text){ el.textContent = '\u00a0'; return }
    const re = /==(?:(y|p|g|b):)?(.+?)==/g;
    let last = 0, m;
    while((m = re.exec(text))){
      if(m.index > last) el.append(text.slice(last, m.index));
      const mk = document.createElement('mark');
      mk.className = 'hl-' + (m[1] || 'y');
      mk.textContent = m[2];
      el.append(mk);
      last = re.lastIndex;
    }
    if(last < text.length) el.append(text.slice(last));
  }
  function setActive(key){
    ['prev','next','pp','banner'].forEach(k=>{
      const el = $({prev:'wPrev',next:'wNext',pp:'wPP',banner:'wMenu'}[k]);
      el.classList.toggle('on', k===key);
    });
  }
  function showNowPlaying(){
    page = null;
    lcd.classList.remove('show-text');
    $('headTitle').textContent = 'Now Playing';
    setActive(null);
  }
  function showPage(key){
    if(page === key){ showNowPlaying(); return }   // 같은 버튼 한 번 더 누르면 돌아가기
    const p = PAGES[key]; if(!p) return;
    page = key;
    $('headTitle').textContent = p.title;
    box.innerHTML = '';
    p.lines.forEach(line=>{
      const head = line.startsWith('## ');
      const el = document.createElement(head ? 'h4' : 'p');
      inline(el, head ? line.slice(3) : line);
      box.appendChild(el);
    });
    box.scrollTop = 0;
    lcd.classList.add('show-text');
    setActive(key);
    updateThumb();
  }
  function updateThumb(){
    const th = $('sthumb');
    const h = box.clientHeight, sh = box.scrollHeight;
    if(sh <= h + 1){ th.parentElement.style.display='none'; return }
    th.parentElement.style.display='block';
    const ratio = h/sh;
    th.style.height = Math.max(12, ratio*100) + '%';
    th.style.top = (box.scrollTop/sh*100) + '%';
  }
  box.addEventListener('scroll', updateThumb);
  window.addEventListener('resize', updateThumb);

  /* ----- wheel buttons ----- */

  /* ----- MUSIC: 화면이 배너 창으로 바뀌어요 (이미지를 누르면 링크로 이동) ----- */
  function normLink(u){
    u = String(u || '').trim();
    if(!u || /^(javascript|data|vbscript):/i.test(u)) return '';
    if(!/^([a-z][a-z0-9+.-]*:|\/|\.|#)/i.test(u)) u = 'https://' + u;
    return u;
  }
  function showBanners(){
    if(page === 'banner'){ showNowPlaying(); return }   // 한 번 더 누르면 돌아가기

  $('wPP').onclick     = guard(()=>showPage('pp'));

  /* ----- wheel rotate: 글 화면에서는 스크롤, 재생 화면에서는 볼륨 ----- */
  const wheel = $('wheel');
  let drag = null;
  wheel.addEventListener('pointerdown', e=>{
    const r = wheel.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const dx = e.clientX-cx, dy = e.clientY-cy;
    if(Math.hypot(dx,dy) < r.width*.19) return;
    drag = {last:Math.atan2(dy,dx), acc:0, moved:false, id:e.pointerId, cx, cy};
  });
  wheel.addEventListener('pointermove', e=>{
    if(!drag) return;
    const a = Math.atan2(e.clientY-drag.cy, e.clientX-drag.cx);
    let d = a - drag.last;
    if(d > Math.PI) d -= 2*Math.PI;
    if(d < -Math.PI) d += 2*Math.PI;
    drag.last = a; drag.acc += d;
    if(!drag.moved && Math.abs(drag.acc)*180/Math.PI > 10){
      drag.moved = true;
      try{ wheel.setPointerCapture(drag.id) }catch(_){}
    }
    if(!drag.moved) return;
    if(page){
      box.scrollTop += d * 140;
    }else{
      setVol(vol + d/(2*Math.PI)*1.2);
      toast('Volume ' + Math.round(vol*100) + '%');
    }
  });
  const endDrag = ()=>{
    if(drag && drag.moved){ suppress = true; setTimeout(()=>suppress=false,0) }
    drag = null;
  };
  wheel.addEventListener('pointerup', endDrag);
  wheel.addEventListener('pointercancel', endDrag);

  // 글 화면에서 마우스 휠로도 스크롤
  box.addEventListener('wheel', e=>{ e.stopPropagation() }, {passive:true});

  /* =====================================================
     관리자 (상단 오른쪽 ❚❚ 아이콘을 누르면 열려요)
     ===================================================== */
  const CFGKEY = 'ipod_admin_cfg_v1';
  function guessRepo(){
    const h = location.hostname, p = location.pathname.split('/').filter(Boolean);
    if(h.endsWith('.github.io')) return {owner:h.split('.')[0], repo:p[0] || h};
    return {};
  }
  let savedCfg = {};
  try{ savedCfg = JSON.parse(localStorage.getItem(CFGKEY)) || {} }catch(e){}
  const cfg = Object.assign({token:'', owner:'', repo:'', branch:'main', path:'data.json'}, guessRepo(), savedCfg);
  const saveCfg = ()=>{ try{ localStorage.setItem(CFGKEY, JSON.stringify(cfg)) }catch(e){} };

  const admBack = $('admBody') && $('admBack'), admBody = $('admBody'), admStatus = $('admStatus');
  let draft = null, tab = 'conn';
  const clone = o => JSON.parse(JSON.stringify(o));
  function status(msg, type){ admStatus.textContent = msg || ''; admStatus.className = 'adm-status ' + (type || '') }

  function h(tag, attrs, ...kids){
    const el = document.createElement(tag);
    for(const k in (attrs||{})){
      const v = attrs[k];
      if(k === 'class') el.className = v;
      else if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if(k === 'value') el.value = v;
      else el.setAttribute(k, v);
    }
    kids.flat().forEach(c => el.append(c));
    return el;
  }
  function field(label, val, oninput, ph, type){
    const inp = h('input', {class:'adm-in', type:type||'text', placeholder:ph||'', value:val||''});
    inp.addEventListener('input', ()=>oninput(inp.value));
    return [h('label', {class:'adm-lab'}, label), inp];
  }

  /* ----- GitHub API ----- */
  const hdr = ()=>({Authorization:'Bearer '+cfg.token, Accept:'application/vnd.github+json'});
  const api = path => `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/` + path.split('/').map(encodeURIComponent).join('/');
  function need(){ if(!cfg.token || !cfg.owner || !cfg.repo) throw new Error('GitHub 탭에서 토큰 / 아이디 / 저장소를 먼저 입력해 주세요') }
  async function errMsg(r){ let m=''; try{ m=(await r.json()).message }catch(e){} return `GitHub ${r.status}: ${m||'요청에 실패했어요'}` }

  async function checkConn(){
    try{
      need(); status('확인 중…');
      const r = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}`, {headers:hdr()});
      if(r.status === 401) throw new Error('토큰이 올바르지 않아요');
      if(r.status === 404) throw new Error('저장소를 찾을 수 없어요 (아이디 / 저장소 이름 / 토큰 권한 확인)');
      if(!r.ok) throw new Error(await errMsg(r));
      const j = await r.json();
      if(j.permissions && !j.permissions.push) throw new Error('쓰기 권한이 없는 토큰이에요');
      status('연결 성공: ' + j.full_name, 'ok');
    }catch(e){ status(e.message, 'err') }
  }

  // 이미지는 가로세로 최대 800px로 줄여서 올려요 (저장소가 무거워지지 않게)
  function shrinkImage(file){
    const orig = (file.name.match(/\.[A-Za-z0-9]+$/) || ['.png'])[0].toLowerCase();
    return new Promise(res=>{
      if(!file.type.startsWith('image/') || file.type === 'image/gif'){ res({blob:file, ext:orig}); return }
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = ()=>{
        const s = Math.min(1, 800 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const png = file.type === 'image/png';
        c.toBlob(b=>{
          URL.revokeObjectURL(url);
          res(b ? {blob:b, ext: png ? '.png' : '.jpg'} : {blob:file, ext:orig});
        }, png ? 'image/png' : 'image/jpeg', .9);
      };
      img.onerror = ()=>{ URL.revokeObjectURL(url); res({blob:file, ext:orig}) };
      img.src = url;
    });
  }

  async function upload(file, dir, extOverride){
    need(); status('올리는 중…');
    const ext = extOverride || (file.name.match(/\.[A-Za-z0-9]+$/) || [''])[0].toLowerCase();
    const path = dir + '/' + Date.now() + ext;
    const b64 = await new Promise((res, rej)=>{
      const fr = new FileReader();
      fr.onload = ()=>res(String(fr.result).split(',')[1]);
      fr.onerror = ()=>rej(new Error('파일을 읽을 수 없어요'));
      fr.readAsDataURL(file);
    });
    const r = await fetch(api(path), {method:'PUT', headers:hdr(), body:JSON.stringify({message:'upload '+path, content:b64, branch:cfg.branch})});
    if(!r.ok) throw new Error(await errMsg(r));
    return path;
  }

  async function saveAll(){
    try{
      need(); status('저장 중…');
      const out = {tracks: draft.tracks.filter(t=>t.title || t.src), pages: draft.pages, banners: draft.banners.filter(b=>b.img || b.link)};
      if(!out.tracks.length) throw new Error('노래가 한 곡 이상 있어야 해요');
      const url = api(cfg.path);
      let sha;
      const g = await fetch(url + '?ref=' + encodeURIComponent(cfg.branch), {headers:hdr()});
      if(g.ok) sha = (await g.json()).sha;
      else if(g.status !== 404) throw new Error(await errMsg(g));
      const bytes = new TextEncoder().encode(JSON.stringify(out, null, 2));
      let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
      const r = await fetch(url, {method:'PUT', headers:hdr(), body:JSON.stringify({message:'update player data', content:btoa(bin), branch:cfg.branch, ...(sha ? {sha} : {})})});
      if(!r.ok) throw new Error(await errMsg(r));
      applyData(clone(out));
      status('저장했어요! 사이트에 반영되기까지 1~2분 걸릴 수 있어요', 'ok');
    }catch(e){ status(e.message, 'err') }
  }

  /* ----- apply data to the player ----- */
  function applyData(d){
    if(!d) return;
    const before = TRACKS[idx] && TRACKS[idx].src;
    if(Array.isArray(d.tracks) && d.tracks.length) TRACKS = d.tracks;
    if(d.pages) PAGES = Object.assign({}, PAGES, d.pages);
    if(Array.isArray(d.banners)) BANNERS = d.banners;
    idx = Math.min(idx, TRACKS.length - 1);
    if((TRACKS[idx].src || '') !== (before || '')) loadTrack(idx, false);
    else renderTrack();
    if(page){ const p = page; page = null; p === 'banner' ? showBanners() : showPage(p) }
  }

  /* ----- admin UI ----- */
  const previews = {};
  function coverRow(t){
    const thumb = h('img', {alt:'', style:'width:56px;height:56px;object-fit:cover;border:1px solid #c8c8cd;border-radius:3px;background:#eee;flex:none;display:' + (t.cover ? 'block' : 'none')});
    if(t.cover) thumb.src = previews[t.cover] || t.cover;
    const name = h('div', {class:'adm-hint', style:'margin:0;flex:1;min-width:0;word-break:break-all'}, t.cover || '이미지 없음');
    const file = h('input', {type:'file', accept:'image/*', style:'display:none'});
    file.addEventListener('change', async ()=>{
      const f = file.files[0]; if(!f) return;
      try{
        const {blob, ext} = await shrinkImage(f);
        const p = await upload(blob, 'images', ext);
        previews[p] = URL.createObjectURL(blob);
        t.cover = p; thumb.src = previews[p]; thumb.style.display = 'block'; name.textContent = p;
        status('올렸어요: ' + p, 'ok');
      }catch(e){ status(e.message, 'err') }

    return h('div', {}, h('label', {class:'adm-lab'}, '커버 이미지'),
      h('div', {class:'adm-row', style:'align-items:center'}, thumb, name,

        file));
  }

  // 형광펜: 선택한 글자를 ==글자== 로 감싸요
  function hlWrap(ta, p, c){
    const s = ta.selectionStart, e = ta.selectionEnd;
    if(s === e){ status('형광펜을 칠할 글자를 먼저 드래그해서 선택해 주세요', 'err'); return }
    const sel = ta.value.slice(s, e);
    if(sel.includes('\n')){ status('한 줄 안에서만 선택할 수 있어요', 'err'); return }
    const open = c === 'y' ? '==' : '==' + c + ':';
    ta.value = ta.value.slice(0, s) + open + sel + '==' + ta.value.slice(e);
    ta.selectionStart = s; ta.selectionEnd = s + open.length + sel.length + 2;
    p.lines = ta.value.split('\n');
    status('');
  }
  function hlClear(ta, p){
    let s = ta.selectionStart, e = ta.selectionEnd;
    s = ta.value.lastIndexOf('\n', s - 1) + 1;
    const nl = ta.value.indexOf('\n', e);
    e = nl === -1 ? ta.value.length : nl;
    const cleaned = ta.value.slice(s, e).replace(/==(?:(?:y|p|g|b):)?(.+?)==/g, '$1');
    ta.value = ta.value.slice(0, s) + cleaned + ta.value.slice(e);
    p.lines = ta.value.split('\n');
    status('');
  }

  function renderConn(){

      ...field('저장소 이름 (repo)', cfg.repo, v=>{ cfg.repo = v.trim(); saveCfg() }, '예: ipod'),
      ...field('브랜치', cfg.branch, v=>{ cfg.branch = v.trim() || 'main'; saveCfg() }, 'main'),

      h('div', {class:'adm-row', style:'margin-top:10px'}, h('button', {class:'adm-btn', type:'button', onclick:checkConn}, '연결 확인')),

        h('br'), '· GitHub → Settings → Developer settings → Fine-grained tokens 에서 이 저장소를 고르고 Contents: Read and write 권한을 주세요.',
        h('br'), '· 올린 커버 이미지는 images/ 폴더에 저장돼요 (가로세로 최대 800px로 줄여서 올려요). 주소는 이 페이지 기준 상대 경로로 들어가요.')
    );

  function renderSongs(){
    draft.tracks.forEach((t, i)=>{

  function renderPages(){
    [['prev','⏮ 왼쪽 버튼'], ['next','⏭ 오른쪽 버튼'], ['pp','⏯ 아래 버튼']].forEach(([k, label])=>{
      const p = draft.pages[k] || (draft.pages[k] = {title:'', lines:[]});
      const ta = h('textarea', {class:'adm-ta'});
      ta.value = (p.lines || []).join('\n');
      ta.addEventListener('input', ()=>{ p.lines = ta.value.split('\n') });
      const swatch = [['y','노랑','#fff36b'], ['p','분홍','#ffb8d0'], ['g','초록','#b6f0c0'], ['b','하늘','#b5dcff']];

        ...swatch.map(([c, n, bg])=>h('button', {class:'adm-btn', type:'button', style:'background:'+bg, onmousedown:e=>e.preventDefault(), onclick:()=>hlWrap(ta, p, c)}, '형광펜 ' + n)),
        h('button', {class:'adm-btn', type:'button', onmousedown:e=>e.preventDefault(), onclick:()=>hlClear(ta, p)}, '선택한 줄 형광펜 지우기'));
      admBody.append(h('div', {class:'adm-card'},
        h('div', {class:'adm-sec'}, label),
        ...field('제목 (화면 맨 위에 나와요)', p.title, v=>p.title = v),
        h('label', {class:'adm-lab'}, '내용'), bar, ta));

    admBody.append(h('div', {class:'adm-hint'}, '형광펜: 글자를 드래그해서 선택한 뒤 색 버튼을 누르면 ==글자== 로 감싸져요 (분홍은 ==p:글자==). 줄 맨 앞에 "## " 를 붙이면 파란 소제목이 되고, 빈 줄은 간격이 돼요.'));
  }
  function renderBanners(){
    draft.banners.forEach((b, i)=>{
      const thumb = h('img', {alt:'', style:'width:124px;aspect-ratio:3.1/1;object-fit:cover;border:1px solid #c8c8cd;border-radius:3px;background:#eee;flex:none;display:' + (b.img ? 'block' : 'none')});
      if(b.img) thumb.src = previews[b.img] || b.img;
      const name = h('div', {class:'adm-hint', style:'margin:0;flex:1;min-width:0;word-break:break-all'}, b.img || '이미지 없음');
      const file = h('input', {type:'file', accept:'image/*', style:'display:none'});
      file.addEventListener('change', async ()=>{
        const f = file.files[0]; if(!f) return;
        try{
          const {blob, ext} = await shrinkImage(f);
          const p = await upload(blob, 'images', ext);
          previews[p] = URL.createObjectURL(blob);
          b.img = p; thumb.src = previews[p]; thumb.style.display = 'block'; name.textContent = p;
          status('올렸어요: ' + p, 'ok');
        }catch(e){ status(e.message, 'err') }
        file.value = '';
      });
      const move = d => ()=>{
        const j = i + d; if(j < 0 || j >= draft.banners.length) return;
        [draft.banners[i], draft.banners[j]] = [draft.banners[j], draft.banners[i]]; render();
      };
      admBody.append(h('div', {class:'adm-card'},
        h('div', {class:'adm-sec'}, '배너 ' + (i+1)),
        h('label', {class:'adm-lab'}, '배너 이미지'),
        h('div', {class:'adm-row', style:'align-items:center'}, thumb, name,
          h('button', {class:'adm-btn', type:'button', onclick:()=>file.click()}, '파일 업로드'), file),
        ...field('링크 (누르면 이동할 주소)', b.link, v=>b.link = v.trim(), 'https://…'),
        h('div', {class:'adm-row', style:'margin-top:8px'},
          h('button', {class:'adm-btn', type:'button', onclick:move(-1)}, '↑ 위로'),
          h('button', {class:'adm-btn', type:'button', onclick:move(1)}, '↓ 아래로'),
          h('button', {class:'adm-btn del', type:'button', onclick:()=>{ draft.banners.splice(i,1); render() }}, '이 배너 삭제'))
      ));
    });
    admBody.append(
      h('button', {class:'adm-btn', type:'button', onclick:()=>{ draft.banners.push({img:'', link:''}); render() }}, '+ 배너 추가'),
      h('div', {class:'adm-hint'}, 'MUSIC 버튼을 누르면 화면이 배너 창으로 바뀌고, 여기서 추가한 배너가 위에서 아래로 모두 나와요 (휠을 돌리면 스크롤). 가로로 긴 이미지(비율 약 3:1, 예: 600×190)가 가장 잘 맞아요. 링크를 비워두면 눌러도 이동하지 않아요.')
    );
  }
  function render(){
    document.querySelectorAll('.adm-tab').forEach(b=>b.classList.toggle('on', b.dataset.tab === tab));
    admBody.innerHTML = '';
    ({conn:renderConn, songs:renderSongs, pages:renderPages, banners:renderBanners})[tab]();
  }
  function openAdmin(){
    draft = clone({tracks:TRACKS, pages:PAGES, banners:BANNERS});
    tab = cfg.token ? 'songs' : 'conn';
    status('');
    admBack.classList.add('show');
    render();

  const closeAdmin = ()=>admBack.classList.remove('show');

  $('adminBtn').onclick = openAdmin;
  $('admX').onclick = closeAdmin;
  $('admSave').onclick = saveAll;
  document.querySelectorAll('.adm-tab').forEach(b=>b.onclick = ()=>{ tab = b.dataset.tab; render() });
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeAdmin() });

  /* ----- start ----- */
  loadTrack(0,false);
  fetch('data.json?' + Date.now()).then(r=>r.ok ? r.json() : null).then(applyData).catch(()=>{});
})();
</script>
